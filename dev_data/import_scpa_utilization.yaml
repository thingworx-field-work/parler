# Run from the repository root:
#   uv run import-dev --apply --import_control import_scpa_utilization
#
# Prerequisites (not part of this repository):
# - .env in the repository root with DEV_SERVER and DEV_KEY; DEV_KEY is an Application Key you created
#   on the target ThingWorx server.
# - parler-agent/build/parler-agent.zip and parler-ui-widget/dist/parler-ui-widget.zip, built with
#   ./build-extension.sh and ./build-widget.sh.
# - The SCPA solution dataset archives in dev_data/SCPA/ (ALL_DATASETS_DEV_*.zip).
import_order:
- action: import_extension
  files:
  - parler-agent/build/parler-agent.zip
  - parler-ui-widget/dist/parler-ui-widget.zip
  - dev_data/SCPA/ALL_DATASETS_DEV_0001_Platform.zip
  - dev_data/SCPA/ALL_DATASETS_DEV_1001_SCPA_Core.zip
  - dev_data/SCPA/ALL_DATASETS_DEV_2001_SCPA.zip
  
- action: import_file
  files:
  - dev_data/Entities_SteamSensor.xml
  - dev_data/ParlerAgentBasic.xml
  - dev_data/Things_AIDocRepository.xml
  - dev_data/Things_ConfigurationRepository.xml


  # mashup demo with embedded mashup
  - dev_data/Parler_SCPA_Demo.xml

  # utilization services called by the sample's extended tools
  - dev_data/scpa_utilization/Things_SCPA_Utilization_helper.xml

  # temp mashups for host context v2
  #- dev_data/temp_parler_Mashups.xml

  # change mashup configuration
  - dev_data/scpa_utilization/Things_PTCTS.AssetMonitoring.Manager.xml
  - dev_data/scpa_utilization/Things_PTC.Charts.Manager.xml
  - dev_data/scpa_utilization/Things_PTCSC.UtilizationUI.Manager.xml


  # database connection for generating simulated data points;
  # - dev_data/scpa_utilization/database_connect_pp.xml
  - dev_data/scpa_utilization/database_connect_testbox.xml

