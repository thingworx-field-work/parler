  file_repository: ConfigurationRepository
  path: /policies
  files:
  - dev_data/scpa_utilization/policies/invoke_service.json

- action: upload_file
  file_repository: ConfigurationRepository
  path: /taxonomies
  files:
  - dev_data/scpa_utilization/taxonomies/identity-types.json
  - dev_data/scpa_utilization/taxonomies/asset-types.json

# disable demoMode and set DaysToKeepWhenPurging to 1000
