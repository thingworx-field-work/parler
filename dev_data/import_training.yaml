# Run from the repository root:
#   uv run import-dev --apply --import_control import_training
#
# Prerequisites:
# - ThingWorx already has parler-agent 0.1.224 and parler-ui-widget 0.1.92.
# - The solution extensions/projects named by the two project exports are already installed.
# - The repository-root .env supplies DEV_SERVER and DEV_KEY to the import utility.
#
# This is a course overlay. It contains no credentials and does not publish or install extensions.
root_folder: '.'
import_order:
- action: import_file
  files:
  - training/dev_data/Things_AIArtifactRepository.xml
  - training/dev_data/Things_ShiftHelper.xml
  - training/dev_data/Parler_SCPA_Demo.xml
  - training/dev_data/Parler_SCPA_Guidance.xml

- action: rest_call
  service: /Thingworx/Things/ConfigurationRepository/services/CreateFolder
  payload: |
    {"path":"/policies"}

- action: rest_call
  service: /Thingworx/Things/ConfigurationRepository/services/CreateFolder
  payload: |
    {"path":"/taxonomies"}

- action: rest_call
  service: /Thingworx/Things/ConfigurationRepository/services/CreateFolder
  payload: |
    {"path":"/tools"}

- action: upload_file
  file_repository: ConfigurationRepository
  path: /policies
  files:
  - training/dev_data/policies/invoke_service.json

- action: upload_file
  file_repository: ConfigurationRepository
  path: /taxonomies
  files:
  - training/dev_data/taxonomies/identity-types.json
  - training/dev_data/taxonomies/asset-types.json

- action: upload_file
  file_repository: ConfigurationRepository
  path: /tools
  files:
  - training/dev_data/tools/extended_tools.json
