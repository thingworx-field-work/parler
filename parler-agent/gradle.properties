org.gradle.parallel=true

# When true, build uses JARs under twx-lib/all only (no Maven Central / ThingWorx Artifactory for dependencies).
# Populate twx-lib/all once on a networked machine: ./gradlew -PuseLocalTwxLib=false syncTwxLib
useLocalTwxLib=false

twxRepoUrl=https://artifactory.rd2.thingworx.io/artifactory
artifactory_snapshot_repokey=twxlibs-snapshot
artifactory_release_repokey=twxlibs-release
artifactory_publish_repokey=twxlibs-canary-local
artifactory_internal_releases_repokey=internal-releases
artifactory_internal_snapshots_repokey=internal-snapshots
artifactory_external_repokey=external-repos
